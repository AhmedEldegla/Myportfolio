  <!-- Sign in -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="loginForm">
      <span class="brand__mark login__mark" aria-hidden="true">AE</span>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage bookings, messages and your availability.</p>
      <label class="field"><span>Password</span><input id="pw" type="password" autocomplete="current-password" required autofocus /></label>
      <label class="check"><input type="checkbox" id="remember" checked /> Keep me signed in on this device</label>
      <button class="btn btn--accent btn--block" type="submit">Sign in</button>
      <p class="login__err" id="loginErr" role="alert"></p>
    </form>
  </main>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <a class="side__brand" href="#/overview"><span class="brand__mark" aria-hidden="true">AE</span><span>Dashboard</span></a>
      <nav class="side__nav" id="nav" aria-label="Dashboard">
        <a href="#/overview" data-route="overview"><svg class="ico"><use href="#i-home"/></svg>Overview</a>
        <a href="#/calendar" data-route="calendar"><svg class="ico"><use href="#i-cal"/></svg>Calendar</a>
        <a href="#/bookings" data-route="bookings"><svg class="ico"><use href="#i-list"/></svg>Bookings<span class="badge" id="bUpcoming" hidden></span></a>
        <a href="#/inbox" data-route="inbox"><svg class="ico"><use href="#i-inbox"/></svg>Inbox<span class="badge badge--hot" id="bInbox" hidden></span></a>
        <a href="#/chats" data-route="chats"><svg class="ico"><use href="#i-chat"/></svg>AI chats</a>
        <a href="#/analytics" data-route="analytics"><svg class="ico"><use href="#i-chart"/></svg>Analytics</a>
        <p class="side__label">Setup</p>
        <a href="#/availability" data-route="availability"><svg class="ico"><use href="#i-sliders"/></svg>Availability</a>
        <a href="#/types" data-route="types"><svg class="ico"><use href="#i-layers"/></svg>Meeting types</a>
        <a href="#/settings" data-route="settings"><svg class="ico"><use href="#i-gear"/></svg>Settings</a>
      </nav>
      <div class="side__foot">
        <a class="side__site" href="./" target="_blank" rel="noreferrer"><svg class="ico"><use href="#i-external"/></svg>View website</a>
        <button type="button" class="side__out" data-action="logout"><svg class="ico"><use href="#i-logout"/></svg>Log out</button>
      </div>
    </aside>
    <div class="scrim" id="scrim" data-action="closeSide"></div>

    <div class="main">
      <header class="top">
        <button type="button" class="iconBtn top__menu" data-action="openSide" aria-label="Open menu"><svg class="ico"><use href="#i-menu"/></svg></button>
        <div class="top__title"><h1 id="pageTitle">Overview</h1><p id="pageSub" class="muted"></p></div>
        <div class="top__actions">
          <button type="button" class="iconBtn" data-action="refresh" aria-label="Refresh"><svg class="ico"><use href="#i-refresh"/></svg></button>
          <button type="button" class="iconBtn" data-action="theme" aria-label="Switch theme"><svg class="ico ico--moon"><use href="#i-moon"/></svg><svg class="ico ico--sun"><use href="#i-sun"/></svg></button>
          <button type="button" class="btn btn--accent btn--sm" data-action="blockTime"><svg class="ico"><use href="#i-plus"/></svg><span>Block time</span></button>
        </div>
      </header>
      <section class="view" id="view" aria-live="polite"></section>
    </div>
  </div>

  <!-- Booking detail drawer -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__scrim" data-action="closeDrawer"></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-label="Booking details" id="drawerPanel"></aside>
  </div>

  <!-- Small dialogs (cancel, reschedule, block time, confirm) -->
  <dialog class="dlg" id="dlg"><form method="dialog" class="dlg__body" id="dlgBody"></form></dialog>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
