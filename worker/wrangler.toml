name = "ahmed-portfolio-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# Public, non-secret settings. Secrets (API keys, passwords) are NOT here:
# they're stored with `npx wrangler secret put NAME` (see SETUP.md).
[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
SITE_URL = "https://www.ahmedeldegla.com"
OWNER_NAME = "Ahmed Eldegla"
OWNER_EMAIL = "ahmeddagla99@gmail.com"
# Sender for booking emails. Must be on a domain verified in Resend (see SETUP.md).
MAIL_FROM = "Ahmed Eldegla <hello@ahmedeldegla.com>"
ALLOWED_ORIGINS = "https://www.ahmedeldegla.com,https://ahmedeldegla.com,https://ahmedeldegla.github.io,http://localhost:5173"

# Bookings database (Cloudflare D1, free tier).
# Created with: npx wrangler d1 create portfolio-bookings
[[d1_databases]]
binding = "DB"
database_name = "portfolio-bookings"
database_id = "82e4fa45-1998-46c6-9e86-948e34604444"
migrations_dir = "migrations"

# Reminders and housekeeping every 10 minutes
[triggers]
crons = ["*/10 * * * *"]
